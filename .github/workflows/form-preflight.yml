name: Form enum current merge preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {"python": "3.10", "library": {"name": "kiota_serialization_form", "path": "packages/serialization/form"}}
          - {"python": "3.11", "library": {"name": "kiota_serialization_form", "path": "packages/serialization/form"}}
          - {"python": "3.12", "library": {"name": "kiota_serialization_form", "path": "packages/serialization/form"}}
          - {"python": "3.13", "library": {"name": "kiota_serialization_form", "path": "packages/serialization/form"}}
          - {"python": "3.14", "library": {"name": "kiota_serialization_form", "path": "packages/serialization/form"}}
          - {"python": "3.14", "library": {"name": "kiota_abstractions", "path": "packages/abstractions"}}
          - {"python": "3.14", "library": {"name": "kiota_authentication_azure", "path": "packages/authentication/azure"}}
          - {"python": "3.14", "library": {"name": "kiota_http", "path": "packages/http/httpx"}}
          - {"python": "3.14", "library": {"name": "kiota_serialization_json", "path": "packages/serialization/json"}}
          - {"python": "3.14", "library": {"name": "kiota_serialization_text", "path": "packages/serialization/text"}}
          - {"python": "3.14", "library": {"name": "kiota_serialization_multipart", "path": "packages/serialization/multipart"}}
          - {"python": "3.14", "library": {"name": "kiota_bundle", "path": "packages/bundle"}}
    defaults:
      run:
        working-directory: ${{ matrix.library.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9e794343ec93e6a674b5283a69098321a548d58c
          fetch-depth: 2
          persist-credentials: false
      - name: Verify tested commit
        working-directory: .
        env:
          EXPECTED_SHA: 9e794343ec93e6a674b5283a69098321a548d58c
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD^1)" = "da8bdb7e5874d1bf563eadefa4ec66e5cddf2aee"
          test "$(git rev-parse HEAD^2)" = "3ab36ceba467bf2c7cf5b282e34c568fa21d6b70"
          git merge-base --is-ancestor 3ab36ceba467bf2c7cf5b282e34c568fa21d6b70 HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check formatting
        run: yapf -dr ${{ matrix.library.name }}
      - name: Normalize imports as upstream CI does
        run: |
          isort ${{ matrix.library.name }}
          git diff --stat
      - name: Verify contribution source needs no normalization
        if: matrix.library.name == 'kiota_serialization_form'
        run: git diff --exit-code -- .
      - name: Pylint
        run: pylint ${{ matrix.library.name }} --disable=W --rcfile=.pylintrc
      - name: Mypy
        run: mypy ${{ matrix.library.name }}
      - name: Pytest
        run: pytest
